<div class="cat-recipe">
  <div class="wrapper">
    <app-menu-bar-component
      [displayArrow]="true"
      [text]="'Cookbook'"
      [goTo]="'/cookbook'"
    ></app-menu-bar-component>

    <div class="generate">
      <app-primary-button-component [text]="'Generate a recipe'"></app-primary-button-component>
    </div>

    <div class="all-recipes">
      <app-single-cuisine-component [title]="capitalized"></app-single-cuisine-component>

      <div class="list">
        @for (item of recipes; track $index) {
          <app-single-recipe-cookbook-component
            [number]="$index + 1"
            [title]="recipes[$index].name"
            [timeInMin]="recipes[$index].time"
            [time]="recipes[$index].cookingTime"
            [cuisine]="recipes[$index].cuisine"
            [diet]="recipes[$index].dietPreferences"
            [likes]="0"
          ></app-single-recipe-cookbook-component>
        }
      </div>

      <div class="navigation">
        <p><</p>
        <p>></p>
      </div>
    </div>
  </div>
</div>
