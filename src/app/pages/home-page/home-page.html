<div class="home">
  <div class="wrapper">
    <app-menu-bar-component [color]="'white'"></app-menu-bar-component>

    <div class="title">
      <div>
        <p>AI-Powered recipe generator</p>
        <p>Code à Cuisine</p>
      </div>

      <app-primary-button-component
        [color]="'white'"
        [text]="'Get started'"
        routerLink="/generate-recipe"
      ></app-primary-button-component>
    </div>

    <div class="cookbook">
      <p>Hungry for inspiration?</p>
      <app-secondary-button-component
        [color]="'white'"
        [text]="'Go to cookbook'"
        routerLink="/cookbook"
      ></app-secondary-button-component>
    </div>

    <img class="plate1" src="assets/img/plate1.png" alt="" />
    <img class="plate2" src="assets/img/plate2.png" alt="" />
    <img class="plate3" src="assets/img/plate3.png" alt="" />

  </div>
</div>
