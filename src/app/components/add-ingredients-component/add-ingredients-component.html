<section>
  <div class="container">
    <div class="left">
      <p>Ingredient</p>
      <app-input-field-component
        (inputTextSend)="onIngredientInput($event)"
        [value]="ingredientValue"
      ></app-input-field-component>
      <div class="results">
        <p (click)="getSuggestion()">{{ suggestion  }}</p>
      </div>
    </div>
    <div class="right">
      <p>Serving size</p>
      <div class="input">
        <app-input-field-component
          (inputTextSend)="onAmountInput($event)"
          [value]="amountValue"
          [placeholder]="'100'"
          [type]="'number'"
        ></app-input-field-component>
        <app-measurements-component
          (selectedSend)="onSelected($event)"
          [selectedValue]="measurement"
        >
        </app-measurements-component>
        <app-add-component (clicked)="onClick()"></app-add-component>
      </div>
    </div>
  </div>
</section>
